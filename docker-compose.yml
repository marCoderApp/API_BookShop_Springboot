services:
  apirestlibrary: #nombre de la app establecido en application.properties
    build: APIRest_library
    mem_limit: 512m
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:mysql://library:3306/library?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: 123456
      DB_PLATFORM: org.hibernate.dialect.MySQLDialect
    restart: always
    depends_on:
      library:
          condition: service_healthy
  library: #configuraciones de base de datos dockerizada
    image: mysql:8.0.33 #misma versión que esté en el pom
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_PASSWORD: 123456
      MYSQL_DATABASE: library
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 10